# Deploys the documentation site (docs/) to GitHub Pages at
# https://trustci.hidetaka.dev. Tests and npm releases run on CircleCI, not here.
name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      # The site serves skills/trustci/SKILL.md at /skill.md and /.well-known/agent-skills/.
      - "skills/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: withastro/action@v6
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
